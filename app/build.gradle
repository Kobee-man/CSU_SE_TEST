plugins {
    id 'com.android.application'
}

android {
    namespace 'net.micode.notes'
    compileSdk 37

    defaultConfig {
        applicationId "net.micode.notes"
        minSdk 21
        targetSdk 37
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
