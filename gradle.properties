# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Do not use AndroidX: this project is a pure framework app with no support-library deps.
android.useAndroidX=false
android.nonTransitiveRClass=false
# The project lives under a path with Chinese characters; modern AGP/AAPT2 handle UTF-8
# paths, so allow it instead of forcing the project to an ASCII-only location.
android.overridePathCheck=true
